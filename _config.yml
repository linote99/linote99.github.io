archive_generator:
  per_page: 0
  yearly: true
  monthly: false
  daily: false
tag_generator:
  per_page: 0

marked:
  breaks: false
  smartypants: false
  sanitizeUrl: true
  dompurify: true

meta_generator: false
theme: linote
